# RK3576 EBOOK V10 (Rockchip reference e-ink board, model rk3576_ebook)
# SoC: RK3576 (4x A72 + 4x A53), 2GB LPDDR4, 32GB eMMC, AP6212 WiFi/BT
BOARD_NAME="RK3576 EBOOK V10"
BOARD_VENDOR="rockchip"
BOARDFAMILY="rk35xx"
BOOT_SOC="rk3576"
BOARD_MAINTAINER=""
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
# Desktop not needed: e-ink board, headless server image first
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3576-ebook-v10.dtb"
BOOT_SCENARIO="spl-blobs"
IMAGE_PARTITION_TABLE="gpt"
SERIALCON="ttyFIQ0"
BT_UART="/dev/ttyS4"

# AP6212 (BCM43438A1/AP6212A) WiFi firmware from brcmfmac/rockchip bsp packages
function post_family_tweaks__ebook_ap6212_firmware() {
	display_alert "$BOARD" "Ensuring AP6212 firmware packages" "info"
	# brcmfmac firmware for BCM43438 is in firmware-brcm80211 on Ubuntu
	return 0
}
BOOTCONFIG="rk3576-ebook-v10_defconfig"
